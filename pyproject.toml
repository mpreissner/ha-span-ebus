[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "span-bridge"
version = "0.1.0"
description = "Bridge a SPAN Panel MAIN 40 (Gen3) into Home Assistant over MQTT"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "paho-mqtt>=2.1.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
span-bridge = "span_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/span_bridge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
