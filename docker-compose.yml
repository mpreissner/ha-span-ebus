services:
  span-bridge:
    build: .
    container_name: span-bridge
    restart: unless-stopped
    env_file: .env
    volumes:
      # Run 'span-bridge auth' on the host first, then copy the credential file
      # and CA cert into ./config/ so the container can read them.
      - ./config:/config:ro
    environment:
      SPAN_AUTH_FILE: /config/span-auth.json
      SPAN_CA_CERT_DIR: /config/ca-certs
    # The panel advertises itself over mDNS; host networking lets the container
    # resolve span-<serial>.local. Use an explicit SPAN_HOST IP instead if you
    # would rather keep the container on a bridge network.
    network_mode: host
